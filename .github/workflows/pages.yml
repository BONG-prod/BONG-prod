name: Deploy Icysell + BONG Runner to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and compressed assets
        run: |
          node --check game/game.js
          node --check game/theme.js
          node -e "const fs=require('fs'),z=require('zlib');new Function(z.gunzipSync(fs.readFileSync('site/app.js.gz')).toString('utf8'));"
          gzip -t site/app.js.gz site/styles.css.gz

      - name: Build combined website
        run: |
          mkdir -p _site/game
          cp -R site/. _site/
          cp game/index.html game/game.js game/style.css game/site-nav.css game/brand.css game/theme.js game/favicon.svg game/cover.svg _site/game/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
